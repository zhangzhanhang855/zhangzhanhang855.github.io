<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok / API 聊天终端</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f1419;
            color: #e7e9ea;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            border-left: 1px solid #2f3336;
            border-right: 1px solid #2f3336;
        }

        /* Top Config Panel */
        .config-header {
            padding: 16px;
            border-bottom: 1px solid #2f3336;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #16181c;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-group label {
            font-size: 13px;
            color: #71767b;
            width: 70px;
            font-weight: bold;
        }

        .input-group input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #333639;
            background-color: #0f1419;
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        .input-group input:focus {
            border-color: #1d9bf0;
        }

        .btn-save {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background-color: #e7e9ea;
            color: #0f1419;
            font-weight: bold;
            cursor: pointer;
            align-self: flex-end;
            transition: opacity 0.2s;
        }

        .btn-save:hover {
            opacity: 0.9;
        }

        /* Chat Window */
        .messages-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
            background-color: #1d9bf0;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background-color: #202327;
            color: #f7f9f9;
            border-bottom-left-radius: 4px;
        }

        .message.system-error {
            align-self: center;
            background-color: #2c1214;
            color: #f4212e;
            font-size: 13px;
            border: 1px solid #5c181b;
        }

        /* Input Area */
        .input-area {
            padding: 16px;
            border-top: 1px solid #2f3336;
            display: flex;
            gap: 10px;
            background-color: #0f1419;
        }

        .input-area textarea {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #333639;
            background-color: #16181c;
            color: #fff;
            outline: none;
            resize: none;
            height: 48px;
            font-size: 15px;
        }

        .input-area textarea:focus {
            border-color: #1d9bf0;
        }

        .input-area button {
            padding: 0 20px;
            border-radius: 12px;
            border: none;
            background-color: #1d9bf0;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        .input-area button:disabled {
            background-color: #1e3f5a;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- 配置区域 -->
    <div class="config-header">
        <div class="input-group">
            <label>API Key</label>
            <input type="password" id="apiKeyInput" placeholder="sk-..." />
        </div>
        <div class="input-group">
            <label>接口端点</label>
            <input type="text" id="baseUrlInput" value="https://shanshuiapi.com" placeholder="https://shanshuiapi.com" />
        </div>
        <div class="input-group">
            <label>模型名称</label>
            <input type="text" id="modelInput" value="grok-2-latest" placeholder="例如: grok-2-latest, grok-beta, gpt-4o" />
        </div>
        <button class="btn-save" onclick="saveSettings()">保存配置</button>
    </div>

    <!-- 消息展示区 -->
    <div class="messages-list" id="messagesList">
        <div class="message assistant">你好！配置已默认填入你的端点。请填入 API Key 并点击“保存配置”，即可开始对话！</div>
    </div>

    <!-- 消息发送区 -->
    <div class="input-area">
        <textarea id="userInput" placeholder="输入消息 (Enter 发送，Shift + Enter 换行)..." onkeydown="handleKeyDown(event)"></textarea>
        <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
</div>

<script>
    // 历史对话上下文
    let conversationHistory = [
        { role: "system", content: "You are a helpful AI assistant." }
    ];

    // 初始化加载本地配置
    window.onload = () => {
        const savedKey = localStorage.getItem('cfg_api_key');
        const savedUrl = localStorage.getItem('cfg_base_url');
        const savedModel = localStorage.getItem('cfg_model');

        if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
        if (savedUrl) document.getElementById('baseUrlInput').value = savedUrl;
        if (savedModel) document.getElementById('modelInput').value = savedModel;
    };

    // 保存设置到 localStorage
    function saveSettings() {
        const key = document.getElementById('apiKeyInput').value.trim();
        const url = document.getElementById('baseUrlInput').value.trim();
        const model = document.getElementById('modelInput').value.trim();

        if (key) localStorage.setItem('cfg_api_key', key);
        if (url) localStorage.setItem('cfg_base_url', url);
        if (model) localStorage.setItem('cfg_model', model);

        alert('配置已成功保存到本地！');
    }

    // 辅助：追加消息到 DOM
    function appendMessage(role, text) {
        const list = document.getElementById('messagesList');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;
        msgDiv.textContent = text;
        list.appendChild(msgDiv);
        list.scrollTop = list.scrollHeight;
        return msgDiv;
    }

    // 处理 Enter 发送
    function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    // 发送 API 请求
    async function sendMessage() {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        let baseUrl = document.getElementById('baseUrlInput').value.trim();
        const model = document.getElementById('modelInput').value.trim();
        const inputEl = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const prompt = inputEl.value.trim();

        if (!apiKey) {
            alert('请先输入并保存 API Key！');
            return;
        }

        if (!prompt) return;

        // 规范化 Base URL 处理 (移除结尾斜杠)
        baseUrl = baseUrl.replace(/\/+$/, "");
        const targetEndpoint = `${baseUrl}/v1/chat/completions`;

        // UI 状态重置
        inputEl.value = '';
        sendBtn.disabled = true;

        // 追加用户消息
        appendMessage('user', prompt);
        conversationHistory.push({ role: "user", content: prompt });

        // 追加 AI 占位消息
        const assistantMsgEl = appendMessage('assistant', '思考中...');

        try {
            const response = await fetch(targetEndpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: model || 'grok-2-latest',
                    messages: conversationHistory,
                    temperature: 0.7
                })
            });

            const data = await response.json();

            if (!response.ok) {
                // 如果报错，解析服务器返回的具体错误原因
                const errorDetails = data.error?.message || JSON.stringify(data);
                throw new Error(`HTTP ${response.status}: ${errorDetails}`);
            }

            const aiReply = data.choices[0].message.content;
            
            // 渲染成功结果
            assistantMsgEl.textContent = aiReply;
            conversationHistory.push({ role: "assistant", content: aiReply });

        } catch (err) {
            // 错误提示渲染
            assistantMsgEl.className = 'message system-error';
            assistantMsgEl.textContent = `请求失败!\n${err.message}`;
            console.error("API Fetch Error:", err);
        } finally {
            sendBtn.disabled = false;
        }
    }
</script>

</body>
</html>
