<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok AI Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f1419;
            color: #e7e9ea;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            border-left: 1px solid #2f3336;
            border-right: 1px solid #2f3336;
        }

        /* Header / Settings */
        .header {
            padding: 16px;
            border-bottom: 1px solid #2f3336;
            display: flex;
            gap: 10px;
            align-items: center;
            background-color: #0f1419;
        }

        .header input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid #333639;
            background-color: #16181c;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .header input:focus {
            border-color: #1d9bf0;
        }

        .header button {
            padding: 10px 18px;
            border-radius: 20px;
            border: none;
            background-color: #e7e9ea;
            color: #0f1419;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .header button:hover {
            opacity: 0.9;
        }

        /* Chat Window */
        .messages-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
            background-color: #1d9bf0;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background-color: #202327;
            color: #f7f9f9;
            border-bottom-left-radius: 4px;
        }

        .message.system-error {
            align-self: center;
            background-color: #2c1214;
            color: #f4212e;
            font-size: 13px;
        }

        /* Input Area */
        .input-area {
            padding: 16px;
            border-top: 1px solid #2f3336;
            display: flex;
            gap: 10px;
            background-color: #0f1419;
        }

        .input-area textarea {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #333639;
            background-color: #16181c;
            color: #fff;
            outline: none;
            resize: none;
            height: 48px;
            font-size: 15px;
        }

        .input-area textarea:focus {
            border-color: #1d9bf0;
        }

        .input-area button {
            padding: 0 20px;
            border-radius: 12px;
            border: none;
            background-color: #1d9bf0;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        .input-area button:disabled {
            background-color: #1e3f5a;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <input type="password" id="apiKeyInput" placeholder="输入 Grok / xAI API Key (xai-... 或第三方 Key)" />
        <button onclick="saveApiKey()">保存 Key</button>
    </div>

    <div class="messages-list" id="messagesList">
        <div class="message assistant">你好！我是 Grok 界面。请输入你的 API Key 并开始对话吧！</div>
    </div>

    <div class="input-area">
        <textarea id="userInput" placeholder="输入消息..." onkeydown="handleKeyDown(event)"></textarea>
        <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
</div>

<script>
    // 历史对话上下文
    let conversationHistory = [
        { role: "system", content: "You are Grok, a helpful AI assistant." }
    ];

    // 初始化页面，加载存好的 API Key
    window.onload = () => {
        const savedKey = localStorage.getItem('grok_api_key');
        if (savedKey) {
            document.getElementById('apiKeyInput').value = savedKey;
        }
    };

    function saveApiKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        if (key) {
            localStorage.setItem('grok_api_key', key);
            alert('API Key 已保存在本地浏览器中！');
        } else {
            localStorage.removeItem('grok_api_key');
            alert('API Key 已清空！');
        }
    }

    function appendMessage(role, text) {
        const list = document.getElementById('messagesList');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;
        msgDiv.textContent = text;
        list.appendChild(msgDiv);
        list.scrollTop = list.scrollHeight;
        return msgDiv;
    }

    function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    async function sendMessage() {
        const apiKey = localStorage.getItem('grok_api_key') || document.getElementById('apiKeyInput').value.trim();
        const inputEl = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const prompt = inputEl.value.trim();

        if (!apiKey) {
            alert('请先输入并保存 API Key！');
            return;
        }

        if (!prompt) return;

        // 界面更新：清空输入框、禁用发送按钮
        inputEl.value = '';
        sendBtn.disabled = true;

        // 渲染用户消息
        appendMessage('user', prompt);
        conversationHistory.push({ role: "user", content: prompt });

        // 创建等待占位消息
        const assistantMsgEl = appendMessage('assistant', 'Grok 正在思考中...');

        try {
            // 假设使用的是 OpenAI 兼容接口架构（xAI / 中转站标准接口）
            const response = await fetch('https://api.x.ai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: 'grok-2-latest', // 可根据实际需求修改模型名
                    messages: conversationHistory,
                    temperature: 0.7
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || `请求失败 (${response.status})`);
            }

            const aiReply = data.choices[0].message.content;
            
            // 更新界面与上下文
            assistantMsgEl.textContent = aiReply;
            conversationHistory.push({ role: "assistant", content: aiReply });

        } catch (err) {
            assistantMsgEl.className = 'message system-error';
            assistantMsgEl.textContent = `Error: ${err.message}`;
        } finally {
            sendBtn.disabled = false;
        }
    }
</script>

</body>
</html>
